name: Migrações do banco (produção)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/prisma/migrations/**'
      - 'apps/api/prisma/schema.prisma'
  workflow_dispatch:

concurrency:
  group: migracoes
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Aplica as migrações no banco de produção
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL_PROD }}

      - name: Define a senha do papel de runtime
        run: node infra/docker/role.mjs
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.DIRECT_URL_PROD }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD_PROD }}
