services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buscapp
      POSTGRES_PASSWORD: buscapp
      POSTGRES_DB: buscapp
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buscapp -d buscapp']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - '6379:6379'

  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://buscapp_api:${APP_DB_PASSWORD:-buscapp_api}@postgres:5432/buscapp
      MIGRATE_DATABASE_URL: postgresql://buscapp:buscapp@postgres:5432/buscapp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-buscapp_api}
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      HOST: 0.0.0.0
      AUTH_PEPPER: ${AUTH_PEPPER:-dev-pepper-local-com-mais-de-16-caracteres}
      COOKIE_SECURE: 'false'
      # Fuso da escola e seed de desenvolvimento (ver .env.example).
      TZ_ESCOLA: ${TZ_ESCOLA:-America/Sao_Paulo}
      SEED: ${SEED:-false}
      SEED_SENHA_ADMIN: ${SEED_SENHA_ADMIN:-Admin123!}
      SEED_SENHA_PROF: ${SEED_SENHA_PROF:-Prof123!}
      SEED_SENHA_RESP: ${SEED_SENHA_RESP:-Resp123!}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
