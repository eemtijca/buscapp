name: Testes

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Sobe app + PostgreSQL, aplica as migrações no entrypoint e valida a saúde da API.
      - run: docker compose up -d --build

      - name: Aguarda a API responder
        run: |
          for tentativa in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/saude > /dev/null; then
              echo "API disponível após ${tentativa} tentativa(s)."
              exit 0
            fi
            sleep 5
          done
          echo "API não respondeu no tempo esperado."
          docker compose logs app
          exit 1

      # Integração da API e unidade do cache contra o PostgreSQL e o Redis do Compose.
      - name: Roda os testes de unidade e integração
        env:
          NODE_ENV: test
          AUTH_PEPPER: dev-pepper-local-com-mais-de-16-caracteres
          DATABASE_URL: postgresql://buscapp_api:buscapp_api@127.0.0.1:5433/buscapp
          MIGRATE_DATABASE_URL: postgresql://buscapp:buscapp@127.0.0.1:5433/buscapp
          REDIS_URL: redis://127.0.0.1:6379
          STORAGE_DRIVER: disco
        run: npm run test:unit

      - name: Exibe os logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
